project:
  run_id: modern-pb-roe
  mode: modern
  random_seed: 42

data:
  root: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results/runs
  providers:
    prices: baostock
    fundamentals: akshare
    membership: baostock

universe:
  id: CSI300
  expected_size: 300
  minimum_coverage: 0.95

research:
  start_date: 2010-01-01
  factor_start_date: 2012-05-31
  development_end: 2022-12-31
  oos_start: 2023-01-01
  end_date: 2025-12-31
  frequency: month_end
  non_trading_day: previous
  signal_cutoff: close
  execution_lag_days: 1
  execution_price: open
  minimum_listing_days: 120
  winsor_lower: 0.01
  winsor_upper: 0.99
  quantiles: 5

costs:
  base_rate: 0.003
  sensitivity_rates: [0.001, 0.003, 0.005]

quality:
  membership_coverage: 0.95
  announcement_coverage: 0.95
  factor_coverage: 0.80
  maximum_roe_announcement_lag_days: 200

evaluation:
  factor_columns: [bp, roe, paper_score]
  expanded_factor_columns:
    - gross_margin
    - revenue_growth
    - earnings_growth
    - momentum_12_1
    - reversal_1m
    - volatility_60d
    - liquidity_20d
    - beta_252d
    - idiosyncratic_volatility
  return_column: forward_return
  industry_column: industry
  target_neutralization: none
  factor_validation:
    development_start: 2015-01-01
    minimum_ic: 0.02
    minimum_newey_west_t: 2.00
    minimum_year_positive_rate: 0.50
    minimum_quantile_monotonicity: 0.80
    require_positive_30bp_spread: true
    candidates:
      bp: {category: Value, direction: 1}
      paper_score: {category: Value, direction: 1}
      roe: {category: Quality, direction: 1}
      gross_margin: {category: Quality, direction: 1}
      revenue_growth: {category: Growth, direction: 1}
      earnings_growth: {category: Growth, direction: 1}
      momentum_12_1: {category: Momentum, direction: 1}
      reversal_1m: {category: Momentum, direction: 1}
      volatility_60d: {category: Risk & Trading, direction: -1}
      liquidity_20d: {category: Risk & Trading, direction: -1}
      beta_252d: {category: Risk & Trading, direction: -1}
      idiosyncratic_volatility: {category: Risk & Trading, direction: -1}
  model_input_eligibility:
    minimum_valid_months: 60
    minimum_monthly_coverage: 0.80
    minimum_coverage_pass_rate: 0.90
    minimum_median_stock_count: 150
    minimum_unique_values: 20
    significantly_opposite_t: -2.00
    maximum_absolute_correlation: 0.85
    exclude_derived_features: [paper_score_z]
    representative_priority:
      - bp_z
      - roe_z
      - gross_margin_z
      - revenue_growth_z
      - earnings_growth_z
      - momentum_12_1_z
      - reversal_1m_z
      - volatility_60d_z
      - liquidity_20d_z
      - beta_252d_z
      - idiosyncratic_volatility_z

models:
  evidence_status: exploratory_after_prior_oos_review
  train_months: 60
  validation_months: 12
  minimum_train_months: 24
  elastic_net:
    alpha: 0.001
    l1_ratio: 0.20
    max_iter: 10000
  lightgbm:
    n_estimators: 1000
    learning_rate: 0.03
    num_leaves: 15
    max_depth: 4
    min_child_samples: 30
    subsample: 0.80
    colsample_bytree: 0.80
    reg_alpha: 0.10
    reg_lambda: 1.00
    early_stopping_rounds: 50

portfolio:
  covariance_lookback_days: 252
  minimum_return_observations: 60
  risk_aversion: 10.0
  turnover_penalty: 0.001
  max_weight: 0.03
  max_industry_deviation: 0.05
  max_turnover: 0.30
  enforce_industry_constraints: false
