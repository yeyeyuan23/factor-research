project:
  run_id: smoke
  mode: smoke
  random_seed: 42

data:
  root: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results/runs
  providers:
    prices: fixture
    fundamentals: fixture
    membership: fixture

universe:
  id: CSI300
  expected_size: 5
  minimum_coverage: 0.80

research:
  start_date: 2022-01-01
  factor_start_date: 2022-04-01
  development_end: 2023-06-30
  oos_start: 2023-07-01
  end_date: 2023-12-31
  frequency: month_end
  signal_cutoff: close
  execution_lag_days: 1
  execution_price: open
  quantiles: 5

costs:
  base_rate: 0.003
  sensitivity_rates: [0.001, 0.003, 0.005]

quality:
  membership_coverage: 0.80
  announcement_coverage: 0.80
  factor_coverage: 0.70

evaluation:
  factor_columns: [bp, roe, paper_score]
  expanded_factor_columns: []
  return_column: forward_return
  industry_column: industry
  factor_validation:
    development_start: 2022-07-01
    minimum_ic: -1.0
    minimum_newey_west_t: -1000000.0
    minimum_year_positive_rate: 0.0
    minimum_quantile_monotonicity: -1.0
    require_positive_30bp_spread: false
    candidates:
      bp: {category: Value, direction: 1}
      paper_score: {category: Value, direction: 1}
      roe: {category: Quality, direction: 1}
  model_input_eligibility:
    minimum_valid_months: 3
    minimum_monthly_coverage: 0.50
    minimum_coverage_pass_rate: 0.50
    minimum_median_stock_count: 2
    minimum_unique_values: 2
    significantly_opposite_t: -1000000.0
    maximum_absolute_correlation: 1.01
    exclude_derived_features: [paper_score_z]
    representative_priority: [bp_z, roe_z]

models:
  evidence_status: smoke_only
  train_months: 12
  validation_months: 3
  minimum_train_months: 6
  elastic_net:
    alpha: 0.001
    l1_ratio: 0.20
    max_iter: 10000
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 7
    max_depth: 3
    min_child_samples: 3
    subsample: 0.80
    colsample_bytree: 0.80
    reg_alpha: 0.00
    reg_lambda: 0.10
    early_stopping_rounds: 20

portfolio:
  covariance_lookback_days: 252
  minimum_return_observations: 20
  risk_aversion: 5.0
  turnover_penalty: 0.001
  max_weight: 0.35
  max_industry_deviation: 0.20
  max_turnover: 0.50
