project:
  run_id: smoke
  mode: smoke
  random_seed: 42

data:
  root: data
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  results_dir: results/runs
  providers:
    prices: fixture
    fundamentals: fixture
    membership: fixture

universe:
  id: CSI300
  expected_size: 5
  minimum_coverage: 0.80

research:
  start_date: 2022-01-01
  end_date: 2023-12-31
  frequency: month_end
  signal_cutoff: close
  execution_lag_days: 1
  execution_price: open
  quantiles: 5

costs:
  base_rate: 0.003
  sensitivity_rates: [0.001, 0.003, 0.005]

quality:
  membership_coverage: 0.80
  announcement_coverage: 0.80
  factor_coverage: 0.70

evaluation:
  factor_columns: [bp, roe, paper_score]
  return_column: forward_return
  industry_column: industry

models:
  train_months: 12
  validation_months: 3
  minimum_train_months: 6
  elastic_net:
    alpha: 0.001
    l1_ratio: 0.20
    max_iter: 10000
  lightgbm:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 7
    max_depth: 3
    min_child_samples: 3
    subsample: 0.80
    colsample_bytree: 0.80
    reg_alpha: 0.00
    reg_lambda: 0.10
    early_stopping_rounds: 20
